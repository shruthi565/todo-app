<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: darkblue;
    }
    input {
      width: 80%;
      padding: 8px;
      margin-right: 5px;
    }
    button {
      padding: 8px;
      background: darkblue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: navy;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      padding: 8px;
      margin: 5px 0;
      background: #eee;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }
    .done {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>My To-Do List</h1>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

  <script>
  // Load tasks when page loads
  window.onload = function() {
    let savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
    savedTasks.forEach(task => addTask(task.text, task.done));
  }

  function addTask(taskText = null, isDone = false) {
    let input = document.getElementById("taskInput");
    let text = taskText || input.value.trim();
    if (text === "") return;

    let li = document.createElement("li");
    li.innerHTML = `
      <span onclick="toggleTask(this)" class="${isDone ? 'done' : ''}">${text}</span>
      <button onclick="deleteTask(this)">❌</button>
    `;

    document.getElementById("taskList").appendChild(li);
    input.value = ""; // clear input

    saveTasks(); // Save to localStorage
  }

  function toggleTask(task) {
    task.classList.toggle("done");
    saveTasks();
  }

  function deleteTask(btn) {
    btn.parentElement.remove();
    saveTasks();
  }

  function saveTasks() {
    let tasks = [];
    document.querySelectorAll("#taskList li").forEach(li => {
      let text = li.querySelector("span").innerText;
      let done = li.querySelector("span").classList.contains("done");
      tasks.push({ text, done });
    });
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }
</script>


</body>
</html>
